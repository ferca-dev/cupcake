services:
  mongodb:
    image: mongo:7.0
    container_name: cupcake-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: cupcake
    volumes:
      - cupcake_mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cupcake_mongodb_data:
    name: cupcake_mongodb_data
